<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e6e6e6">
<title>Arrows</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#e6e6e6;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
</style></head><body>
<canvas id="c"></canvas>
<script>
(function(){
var SP=30, N=28, DUR=200, COLOR='#141414';
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var W=0,H=0,dpr=1,cols=0,rows=0,ox=0,oy=0;
var cx=[],cy=[],ang=[];
var pressed=false,pid=null,px=0,py=0;
var t=0,from=0,to=0,t0=0,raf=0,dirty=true;

// Shapes: N points each, same ordering, so they interpolate. Arrow points along +x, radius <= 10 (fits a 20px box around cell center).
var verts=[[9,0],[1,6.5],[1,2],[-9,2],[-9,-2],[1,-2],[1,-6.5]];
var arrow=[];
(function(){
  var per=N/verts.length; // 4 pts per edge
  for(var i=0;i<verts.length;i++){
    var a=verts[i],b=verts[(i+1)%verts.length];
    for(var k=0;k<per;k++){var f=k/per;arrow.push([a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f]);}
  }
})();
var dot=[];
for(var i=0;i<N;i++){var a=2*Math.PI*i/N;dot.push([5*Math.cos(a),5*Math.sin(a)]);}

function layout(){
  W=window.innerWidth;H=window.innerHeight;
  dpr=window.devicePixelRatio||1;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  cols=Math.max(1,Math.floor(W/SP));rows=Math.max(1,Math.floor(H/SP));
  ox=(W-cols*SP)/2+SP/2;oy=(H-rows*SP)/2+SP/2;
  var old=ang.slice();
  cx=[];cy=[];ang=[];
  for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){
    cx.push(ox+c*SP);cy.push(oy+r*SP);ang.push(0);
  }
  if(pressed)aim();
  dirty=true;schedule();
}
function aim(){
  for(var i=0;i<cx.length;i++)ang[i]=Math.atan2(py-cy[i],px-cx[i]);
}
function ease(x){return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;}
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  var e=ease(t);
  // morphed local shape
  var sx=new Array(N),sy=new Array(N),i,k;
  for(k=0;k<N;k++){sx[k]=dot[k][0]+(arrow[k][0]-dot[k][0])*e;sy[k]=dot[k][1]+(arrow[k][1]-dot[k][1])*e;}
  ctx.fillStyle=COLOR;
  ctx.beginPath();
  for(i=0;i<cx.length;i++){
    var c=Math.cos(ang[i]),s=Math.sin(ang[i]),X=cx[i],Y=cy[i];
    for(k=0;k<N;k++){
      var x=X+sx[k]*c-sy[k]*s,y=Y+sx[k]*s+sy[k]*c;
      if(k===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.closePath();
  }
  ctx.fill();
}
function frame(now){
  raf=0;
  if(t!==to){
    var p=Math.min(1,(now-t0)/DUR);
    t=from+(to-from)*p;
    if(p>=1)t=to;
    dirty=true;
  }
  if(dirty){dirty=false;draw();}
  if(t!==to||dirty)schedule();
}
function schedule(){if(!raf)raf=requestAnimationFrame(frame);}
function setTarget(v){
  if(to===v)return;
  from=t;to=v;t0=performance.now();
  schedule();
}

function down(e){
  if(pressed)return;
  if(e.target.closest&&e.target.closest('#xm-wrap'))return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  pressed=true;pid=e.pointerId;px=e.clientX;py=e.clientY;
  try{cv.setPointerCapture(pid);}catch(_){}
  aim();dirty=true;setTarget(1);schedule();
  e.preventDefault();
}
function move(e){
  if(!pressed||e.pointerId!==pid)return;
  px=e.clientX;py=e.clientY;aim();dirty=true;schedule();
}
function up(e){
  if(!pressed||e.pointerId!==pid)return;
  pressed=false;pid=null;
  setTarget(0);schedule();
}
window.addEventListener('pointerdown',down,{passive:false});
window.addEventListener('pointermove',move,{passive:true});
window.addEventListener('pointerup',up);
window.addEventListener('pointercancel',up);
window.addEventListener('blur',function(){if(pressed){pressed=false;pid=null;setTarget(0);}});
window.addEventListener('resize',layout);
window.addEventListener('orientationchange',layout);
['gesturestart','gesturechange','gestureend','contextmenu','selectstart','dragstart'].forEach(function(n){
  document.addEventListener(n,function(e){e.preventDefault();},{passive:false});
});
document.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
// test/debug hook
window.__arrows={cell:function(c,r){var i=r*cols+c;return{x:cx[i],y:cy[i],angle:ang[i]};},get t(){return t;},get to(){return to;},get cols(){return cols;},get rows(){return rows;},get pressed(){return pressed;}};
layout();
})();
</script>
<script src="../menu.js"></script></body></html>
