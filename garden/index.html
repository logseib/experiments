<script>
(function(){

var base=document.createElement('canvas'),bx=base.getContext('2d'); // pristine raked pattern, restored by "smooth"

/* ---------- helpers ---------- */

/* ---------- gravel: generated grain, tiled seamlessly ---------- */

    var px=r()*S,py=r()*S,pr=S*(.10+.22*r()),warm=r()<.55,col=warm?'rgba(150,134,108,.05)':'rgba(255,255,255,.09)';

}

  var c=document.createElement('canvas');c.width=c.height=S;var x=c.getContext('2d'),id=x.createImageData(S,S),d=id.data,r=rng(77);

function grooves(ctx,paths){
  var layers=[
    {c:'rgba(96,84,64,.36)',w:1.7,ox:-LX*.55,oy:-LY*.55},
    {c:'rgba(140,127,106,.30)',w:1.5,ox:0,oy:0},
    {c:'rgba(255,254,250,.96)',w:1.35,ox:LX*.85,oy:LY*.85}

  ctx.lineCap='butt';ctx.lineJoin='round';
  for(a=0;a<layers.length;a++){
    L=layers[a];ctx.beginPath();
    for(p=0;p<paths.length;p++){
      var q=paths[p];if(q.length<4)continue;
      ctx.moveTo(q[0]+L.ox,q[1]+L.oy);
      for(i=2;i<q.length;i+=2)ctx.lineTo(q[i]+L.ox,q[i+1]+L.oy);
    }
    ctx.strokeStyle=L.c;ctx.lineWidth=L.w;ctx.stroke();
  }

/* ---------- stones: irregular, faceted, mossy at the foot ---------- */
function layoutSpecs(){

    {x:.385,y:.455,rx:.205,ry:.135,rot:-.42,n:11,seed:14,rings:6},
    {x:.755,y:.595,rx:.112,ry:.078,rot:.55,n:9,seed:41,rings:4},
    {x:.585,y:.715,rx:.064,ry:.046,rot:-.25,n:8,seed:9,rings:3}

    {x:.335,y:.50,rx:.185,ry:.122,rot:-.38,n:11,seed:14,rings:6},
    {x:.555,y:.655,rx:.102,ry:.072,rot:.5,n:9,seed:41,rings:4},
    {x:.635,y:.425,rx:.058,ry:.042,rot:-.22,n:8,seed:9,rings:3}

function makeStone(sp){

    var p0=v[(i+n-1)%n],p1=v[i],p2=v[(i+1)%n];

function stoneColors(){return{dark:[16,17,15],mid:[42,43,39],light:[104,105,96]}}

  for(i=0;i<n;i++){var kk=.46+r()*.2;iv.push([ax+(v[i][0]-ax)*kk,ay+(v[i][1]-ay)*kk])}

    var j=(i+1)%n,mx=(v[i][0]+v[j][0])/2-ax,my=(v[i][1]+v[j][1])/2-ay,ml=Math.hypot(mx,my)||1,b=(mx/ml)*LXn+(my/ml)*LYn; // -1..1

  }
  // plateau: fan of a few facets
  var pc=[ax-S.sp.rx*u*.04,ay-S.sp.ry*u*.05];
  for(i=0;i<n;i++){
    var j2=(i+1)%n,mx2=(iv[i][0]+iv[j2][0])/2-pc[0],my2=(iv[i][1]+iv[j2][1])/2-pc[1],ml2=Math.hypot(mx2,my2)||1,b2=(mx2/ml2)*LXn+(my2/ml2)*LYn;

    c.beginPath();c.moveTo(sx0,sy0);c.quadraticCurveTo(sx0+Math.cos(ang+.6)*len*.5,sy0+Math.sin(ang+.6)*len*.5,sx0+Math.cos(ang)*len,sy0+Math.sin(ang)*len);
    c.strokeStyle='rgba(8,9,8,.5)';c.lineWidth=.9*Math.max(ss,.8);c.stroke();
    c.strokeStyle='rgba(180,182,170,.12)';c.lineWidth=.7;c.translate(.7,.8);c.stroke();c.translate(-.7,-.8);
  }
  // lichen & weathering: soft blotches, and a few strata
  var blN=Math.round((bb[2]-bb[0])*(bb[3]-bb[1])/420);
  for(i=0;i<blN;i++){
    var bx0=lerp(bb[0],bb[2],r()),by0=lerp(bb[1],bb[3],r()),br=(3+r()*r()*13)*Math.max(ss,.7),pale=r()<.55,bg=c.createRadialGradient(bx0,by0,0,bx0,by0,br);
    var bc=pale?'rgba(196,200,184,':'rgba(4,5,4,',ba=pale?.05+r()*.07:.10+r()*.12;

  lg.addColorStop(0,'rgba(236,238,224,.16)');lg.addColorStop(1,'rgba(236,238,224,0)');c.fillStyle=lg;c.fillRect(bb[0],bb[1],bb[2]-bb[0],bb[3]-bb[1]);
  var sg=c.createLinearGradient(S.cx-S.sp.rx*u*.2,S.cy-S.sp.ry*u*.2,S.cx+S.sp.rx*u*.9,S.cy+S.sp.ry*u*1.1);
  sg.addColorStop(0,'rgba(10,10,8,0)');sg.addColorStop(1,'rgba(10,10,8,.34)');c.fillStyle=sg;c.fillRect(bb[0],bb[1],bb[2]-bb[0],bb[3]-bb[1]);

    var depth=-Math.log(1-r()*.97)*3.0*ss,rr2=(.45+r()*1.35)*Math.max(ss,.7)*(depth<3*ss?1.25:.9),gcol=greens[Math.floor(r()*greens.length)];

    var i2=(i+1)%np,ex=poly[i2*2]-poly[i*2],ey=poly[i2*2+1]-poly[i*2+1],el=Math.hypot(ex,ey)||1,ox2=ey/el,oy2=-ex/el,mcx=(poly[i*2]+poly[i2*2])/2-S.cx,mcy=(poly[i*2+1]+poly[i2*2+1])/2-S.cy;

}
function bounds(p){var a=1e9,b=1e9,c=-1e9,d=-1e9;for(var i=0;i<p.length;i+=2){if(p[i]<a)a=p[i];if(p[i]>c)c=p[i];if(p[i+1]<b)b=p[i+1];if(p[i+1]>d)d=p[i+1]}return[a,b,c,d]}

/* ---------- initial pattern: straight rake lines + ripples around each stone ---------- */
function ringsFor(S,idx){
  var N=140,poly=S.poly,rings=[],k,j,maxR=0,raw=[],ang=[];
  var bb=bounds(poly);maxR=Math.hypot(bb[2]-bb[0],bb[3]-bb[1]);
  var rn=rng(S.sp.seed*7+3);
  var ph1=rn()*6.28,ph2=rn()*6.28;
  for(k=0;k<S.sp.rings;k++){
    var d=pitch*(1.35+k),rr=new Array(N),sum=0;
    for(j=0;j<N;j++){
      var th=j/N*6.2832,dx=Math.cos(th),dy=Math.sin(th),lo=0,hi=maxR+d+8;
      for(var it=0;it<22;it++){var mid=(lo+hi)/2;if(sdist(poly,S.cx+dx*mid,S.cy+dy*mid)<d)lo=mid;else hi=mid}
      rr[j]=lo;sum+=lo;
    }
    var mean=sum/N,t=Math.min(.7,k/Math.max(1,S.sp.rings-1)*.62),sm=new Array(N),w=Math.round(1+k*1.4);
    for(j=0;j<N;j++){var s2=0;for(var q=-w;q<=w;q++)s2+=rr[(j+q+N)%N];sm[j]=lerp(s2/(2*w+1),mean,t)}
    var pts=[];
    for(j=0;j<N;j++){
      var th2=j/N*6.2832,wob=.55*Math.sin(th2*3+ph1+k*.7)+.4*Math.sin(th2*5+ph2-k*.5),R=sm[j]+wob*Math.min(1,k*.5+.3);
      pts.push([S.cx+Math.cos(th2)*R,S.cy+Math.sin(th2)*R]);
    }
    rings.push(pts);
  }
  // clip with other stones' territory (ripples meet where the stones' influences meet)
  var paths=[],others=stones.filter(function(o,i){return i!==idx});
  rings.forEach(function(pts){
    var ok=pts.map(function(p){var di=Math.abs(sdist(poly,p[0],p[1]));for(var o=0;o<others.length;o++){if(Math.abs(sdist(others[o].poly,p[0],p[1]))<di-.01)return false}return true});
    var n=pts.length,start=-1,i;
    for(i=0;i<n;i++)if(!ok[i]){start=i;break}
    var run=[];
    if(start<0){var all=[];pts.forEach(function(p){all.push(p[0],p[1])});all.push(pts[0][0],pts[0][1]);all.push(pts[1][0],pts[1][1]);paths.push(all);return}
    for(var c=1;c<=n;c++){
      var ii=(start+c)%n;
      if(ok[ii])run.push(pts[ii][0],pts[ii][1]);
      else{if(run.length>=6)paths.push(run);run=[]}
    }
    if(run.length>=6)paths.push(run);
  });
  var outer=pitch*(1.35+S.sp.rings-1+.75),ring=[];
  // erase region (the outermost ripple expanded)
  var N2=100;for(j=0;j<N2;j++){var th3=j/N2*6.2832,dx3=Math.cos(th3),dy3=Math.sin(th3),lo3=0,hi3=maxR+outer+8;for(var it3=0;it3<20;it3++){var m3=(lo3+hi3)/2;if(sdist(poly,S.cx+dx3*m3,S.cy+dy3*m3)<outer)lo3=m3;else hi3=m3}ring.push(S.cx+dx3*lo3,S.cy+dy3*lo3)}
  return{paths:paths,erase:ring};
}
function buildPattern(){
  var ctx=rx;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  var lines=[],i,off=pitch*.5;
  if(portrait){for(i=-1;off+i*pitch<W+pitch;i++){var x=Math.round((off+i*pitch)*dpr)/dpr;lines.push([x,-6,x,H+6])}}
  else{for(i=-1;off+i*pitch<H+pitch;i++){var y=Math.round((off+i*pitch)*dpr)/dpr;lines.push([-6,y,W+6,y])}}
  grooves(ctx,lines);
  var ringSets=stones.map(function(S,idx){return ringsFor(S,idx)});
  ctx.save();ctx.globalCompositeOperation='destination-out';ctx.fillStyle='#000';
  ringSets.forEach(function(rs){ctx.beginPath();ctx.moveTo(rs.erase[0],rs.erase[1]);for(var k=2;k<rs.erase.length;k+=2)ctx.lineTo(rs.erase[k],rs.erase[k+1]);ctx.closePath();ctx.fill()});
  ctx.restore();
  ringSets.forEach(function(rs){grooves(ctx,rs.paths)});
  base.width=rc.width;base.height=rc.height;bx.setTransform(1,0,0,1,0,0);bx.clearRect(0,0,base.width,base.height);bx.drawImage(rc,0,0);
}

/* ---------- the rake ---------- */
var HL=9,STEP=2,MARGIN=0; // handle length, step length, stone exclusion
var down=false,pid=null,hx=0,hy=0,hh=0,hasH=false,px=0,py=0,last=null,live=null,liveDirty=false,quads=[],raf=0,dirtyRk=false,rkOn=false;
function avoid(x,y){
  for(var pass=0;pass<2;pass++)for(var i=0;i<stones.length;i++){
    var nn=nearest(stones[i].poly,x,y),d=nn[2];
    if(nn[3]||d<MARGIN){
      var dx,dy;
      if(nn[3]){dx=nn[0]-x;dy=nn[1]-y}else{dx=x-nn[0];dy=y-nn[1]}
      var l=Math.hypot(dx,dy);if(l<1e-6){dx=x-stones[i].cx;dy=y-stones[i].cy;l=Math.hypot(dx,dy)||1}
      x=nn[0]+dx/l*MARGIN;y=nn[1]+dy/l*MARGIN;
    }
  }
  return[x,y];
}
function tines(x,y,h){var nx=-Math.sin(h),ny=Math.cos(h),o=[];for(var k=0;k<5;k++){var f=(k-2)*pitch;o.push(x+nx*f,y+ny*f)}return o}
function pull(){
  var guard=0;
  while(guard++<600){
    var dx=px-hx,dy=py-hy,d=Math.hypot(dx,dy);
    if(d<=HL)break;
    var s=Math.min(STEP,d-HL),q=avoid(hx+dx/d*s,hy+dy/d*s),mx=q[0]-hx,my=q[1]-hy,md=Math.hypot(mx,my);
    if(md<.05)break;
    var ang=Math.atan2(my,mx),oh=hh,pre=null;
    if(!hasH){hh=ang;hasH=true;pre=tines(hx,hy,hh)}
    else{var df=ang-hh;while(df>Math.PI)df-=6.2832;while(df<-Math.PI)df+=6.2832;hh+=df*.12}
    if(pre){last=pre}
    if(!last)last=tines(hx,hy,oh);
    if(!live){live=[];for(var k0=0;k0<5;k0++)live.push([last[k0*2],last[k0*2+1]])}
    // erase quad: previous span -> new span (rake head width = 5 tines)
    var hw=pitch*2.5,pnx=-Math.sin(oh),pny=Math.cos(oh),nnx=-Math.sin(hh),nny=Math.cos(hh),ux=mx/md,uy=my/md;
    quads.push([hx-ux-pnx*hw,hy-uy-pny*hw,hx-ux+pnx*hw,hy-uy+pny*hw,q[0]+ux*.6+nnx*hw,q[1]+uy*.6+nny*hw,q[0]+ux*.6-nnx*hw,q[1]+uy*.6-nny*hw]);
    hx=q[0];hy=q[1];
    var tn=tines(hx,hy,hh);for(var k=0;k<5;k++)live[k].push(tn[k*2],tn[k*2+1]);liveDirty=true;
  }
  dirtyRk=true;schedule();
}
function flush(){
  if(quads.length){
    rx.setTransform(dpr,0,0,dpr,0,0);
    rx.save();rx.globalCompositeOperation='destination-out';rx.fillStyle='#000';
    for(var i=0;i<quads.length;i++){var q=quads[i];rx.beginPath();rx.moveTo(q[0],q[1]);rx.lineTo(q[2],q[3]);rx.lineTo(q[4],q[5]);rx.lineTo(q[6],q[7]);rx.closePath();rx.fill()}
    rx.restore();quads.length=0;
  }
  // the live stroke is redrawn whole each frame as single paths, so there are no seams between pointer events
  if(liveDirty&&live){
    lx.setTransform(1,0,0,1,0,0);lx.clearRect(0,0,lc.width,lc.height);
    lx.setTransform(dpr,0,0,dpr,0,0);grooves(lx,live);liveDirty=false;
    if(live[0].length>1500)commit(true);
  }
}
function commit(keep){
  if(!live)return;
  rx.setTransform(1,0,0,1,0,0);rx.drawImage(lc,0,0);
  lx.setTransform(1,0,0,1,0,0);lx.clearRect(0,0,lc.width,lc.height);
  if(keep){for(var k=0;k<5;k++){var a=live[k];live[k]=[a[a.length-2],a[a.length-1]]}}else live=null;
}
function schedule(){if(!raf)raf=requestAnimationFrame(frame)}
var sweepState=null;
function frame(t){
  raf=0;
  flush();
  if(dirtyRk){
    rk.style.transform='translate('+hx.toFixed(1)+'px,'+hy.toFixed(1)+'px) rotate('+((hh+Math.PI/2)*57.2958).toFixed(1)+'deg)';
    if(down&&hasH&&!rkOn){rk.classList.add('on');rkOn=true}
    dirtyRk=false;
  }
  if(sweepState)stepSweep(t);
}
function pt(e){var r=garden.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
var tapT=0,tapX=0,tapY=0,downT=0,downX=0,downY=0,moved=0;
garden.addEventListener('pointerdown',function(e){
  if(down)return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  e.preventDefault();
  down=true;pid=e.pointerId;try{garden.setPointerCapture(pid)}catch(_){}
  var p=pt(e);px=hx=p[0];py=hy=p[1];hasH=false;last=null;live=null;
  downT=performance.now();downX=p[0];downY=p[1];moved=0;
  garden.classList.add('raking');
  rk.style.transform='translate('+hx+'px,'+hy+'px) rotate('+((hh+Math.PI/2)*57.2958)+'deg)';
},{passive:false});
garden.addEventListener('pointermove',function(e){
  if(!down||e.pointerId!==pid)return;
  e.preventDefault();
  var evs=e.getCoalescedEvents?e.getCoalescedEvents():null;if(!evs||!evs.length)evs=[e];
  for(var i=0;i<evs.length;i++){var p=pt(evs[i]);px=p[0];py=p[1];pull()}
  moved=Math.max(moved,Math.hypot(px-downX,py-downY));
},{passive:false});
function up(e){
  if(!down||e.pointerId!==pid)return;
  down=false;pid=null;garden.classList.remove('raking');rk.classList.remove('on');rkOn=false;
  flush();commit(false);last=null;hasH=false;
  if(e.type==='pointerup'&&moved<9&&performance.now()-downT<350){
    var now=performance.now();
    if(now-tapT<420&&Math.hypot(downX-tapX,downY-tapY)<44){tapT=0;smooth()}else{tapT=now;tapX=downX;tapY=downY}
  }
}
garden.addEventListener('pointerup',up);
garden.addEventListener('pointercancel',up);
garden.addEventListener('contextmenu',function(e){e.preventDefault()});
smBtn.addEventListener('pointerdown',function(e){e.stopPropagation()});
smBtn.addEventListener('click',function(){smooth()});

/* ---------- smooth: a five-tine sweep lays the straight lines back down ---------- */
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function smooth(){
  if(sweepState)return;
  flush();commit(down);
  if(reduce){rx.setTransform(1,0,0,1,0,0);rx.clearRect(0,0,rc.width,rc.height);rx.drawImage(base,0,0);return}
  var bw=Math.round(pitch*5*dpr),ext=portrait?rc.height:rc.width,perp=portrait?rc.width:rc.height,nb=Math.ceil(perp/bw),lag=[],i,r=rng(5);
  var ph=r()*6,ph2=r()*6;
  for(i=0;i<nb;i++)lag.push(.055+.05*Math.sin(i*.55+ph)+.03*Math.sin(i*1.3+ph2));
  sweepState={t0:0,dur:2600,bw:bw,nb:nb,lag:lag,prev:new Array(nb).fill(0),ext:ext,perp:perp};
  schedule();
}
function stepSweep(t){
  var s=sweepState;if(!s.t0)s.t0=t;
  var k=clamp((t-s.t0)/s.dur,0,1),e=.5-.5*Math.cos(Math.PI*k),b;
  rx.setTransform(1,0,0,1,0,0);
  for(b=0;b<s.nb;b++){
    var p=clamp((e*1.12-s.lag[b]),0,1),to=Math.round(p*s.ext),from=s.prev[b];if(k>=1)to=s.ext;
    if(to<=from)continue;
    var a0=b*s.bw,aw=Math.min(s.bw,s.perp-a0);
    if(portrait){rx.clearRect(a0,from,aw,to-from);rx.drawImage(base,a0,from,aw,to-from,a0,from,aw,to-from)}
    else{rx.clearRect(from,a0,to-from,aw);rx.drawImage(base,from,a0,to-from,aw,from,a0,to-from,aw)}
    s.prev[b]=to;
  }
  if(k>=1)sweepState=null;else schedule();
}

/* ---------- setup ---------- */
function sizeCanvas(c){c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);c.style.width=W+'px';c.style.height=H+'px'}
function init(){
  dpr=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;u=Math.min(W,H);portrait=H>=W;
  pitch=clamp(u/54,6.5,8.2);MARGIN=pitch*2+7;for(var di=0;di<rkDots.length;di++)rkDots[di].style.left=((di-2)*pitch-1.5)+'px';
  sweepState=null;quads.length=0;live=null;last=null;
  [gc,rc,lc,sc].forEach(sizeCanvas);live=null;
  var S=512,tile=gravelTile(S);
  gx.setTransform(1,0,0,1,0,0);gx.fillStyle=gx.createPattern(tile,'repeat');gx.fillRect(0,0,gc.width,gc.height);
  var gt=grainTile(256);grainEl.style.backgroundImage='url('+gt.toDataURL('image/png')+')';grainEl.style.backgroundSize=(256/dpr)+'px';
  stones=layoutSpecs().map(makeStone);
  buildPattern();
  sx.setTransform(dpr,0,0,dpr,0,0);sx.clearRect(0,0,W,H);
  stones.forEach(function(s){drawStone(sx,s)});
  garden.classList.add('ready');
}
init();
var rt=0,lw=W,lh=H;
window.addEventListener('resize',function(){
  clearTimeout(rt);
  rt=setTimeout(function(){
    var w=window.innerWidth,h=window.innerHeight;
    if(Math.abs(w-lw)<2&&Math.abs(h-lh)<120&&h<=lh+120&&Math.abs(h-lh)>0&&('ontouchstart' in window))return; // mobile browser toolbar: keep the garden as it is
    lw=w;lh=h;init();
  },160);
});
window.__garden={stones:function(){return stones.map(function(s){return{cx:s.cx,cy:s.cy}})},pitch:function(){return pitch}};
})();
</script>
