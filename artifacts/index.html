<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e0e0e">
<title>Artifacts</title>
<style>
html,body{margin:0;height:100%;background:#0e0e0e;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
#board{position:fixed;inset:0;touch-action:none;cursor:grab}
#board.drag{cursor:grabbing}
#stage{position:absolute;left:50%;top:50%;width:min(70vw,340px);aspect-ratio:637/725;transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:opacity .4s ease}
#stage.ready{opacity:1}
#bob{position:absolute;inset:0;animation:bob 5s ease-in-out infinite;filter:drop-shadow(0 14px 14px rgba(0,0,0,.6)) drop-shadow(0 2px 3px rgba(0,0,0,.6))}
@keyframes bob{0%,100%{transform:translateY(-5px)}50%{transform:translateY(5px)}}
#bob img{position:absolute;inset:0;width:100%;height:100%;display:block;visibility:hidden;pointer-events:none;-webkit-user-drag:none}
#bob img.on{visibility:visible}
</style></head><body>
<div id="board"><div id="stage"><div id="bob"></div></div></div>
<script>
(function(){
var N=8,PX=40,board=document.getElementById('board'),stage=document.getElementById('stage'),bob=document.getElementById('bob');
var imgs=[],loaded=0,shown=-1;
function show(i){i=((i%N)+N)%N;if(i===shown)return;if(shown>=0)imgs[shown].classList.remove('on');imgs[i].classList.add('on');shown=i}
for(var i=0;i<N;i++){(function(i){
  var im=new Image();im.alt=i===0?'Rock shard with a fish symbol scratched into it':'';im.draggable=false;
  im.onload=im.onerror=function(){
    var done=function(){if(++loaded===N)ready()};
    if(im.decode)im.decode().then(done,done);else done();
  };
  im.src='frames/f'+i+'.webp';bob.appendChild(im);imgs.push(im);
})(i)}
var pos=0; // continuous frame position; wraps; displayed frame = round(pos) mod N
function setPos(p){pos=p;show(Math.round(pos))}
function ready(){show(0);stage.classList.add('ready');window.__tt.ready=true}
// --- horizontal drag spins the turntable (drag right = rotate forward)
var id=null,lastX=0,samples=[],raf=0,vel=0;
function stopInertia(){if(raf){cancelAnimationFrame(raf);raf=0}vel=0}
board.addEventListener('pointerdown',function(e){
  if(id!==null)return;
  id=e.pointerId;lastX=e.clientX;samples=[{t:performance.now(),x:e.clientX}];stopInertia();
  try{board.setPointerCapture(id)}catch(_){}
  board.classList.add('drag');e.preventDefault();
});
board.addEventListener('pointermove',function(e){
  if(e.pointerId!==id)return;
  var dx=e.clientX-lastX;lastX=e.clientX;setPos(pos+dx/PX);
  var t=performance.now();samples.push({t:t,x:e.clientX});while(samples.length>2&&t-samples[0].t>100)samples.shift();
});
function up(e){
  if(e.pointerId!==id)return;id=null;
  try{board.releasePointerCapture(e.pointerId)}catch(_){}
  board.classList.remove('drag');
  var s=samples,now=performance.now();
  if(s.length>1&&now-s[s.length-1].t<80){var dt=(s[s.length-1].t-s[0].t)/1000;if(dt>0)vel=(s[s.length-1].x-s[0].x)/dt/PX} // frames per second
  else vel=0;
  vel=Math.max(-14,Math.min(14,vel));
  if(Math.abs(vel)>0.8)inertia();else snap();
}
board.addEventListener('pointerup',up);board.addEventListener('pointercancel',up);
function inertia(){
  var last=performance.now();
  function step(t){
    var dt=Math.min(0.05,Math.max(0,(t-last)/1000));last=t;
    setPos(pos+vel*dt);vel*=Math.pow(0.04,dt); // friction: ~4% of the speed left after 1s
    if(Math.abs(vel)<0.8){raf=0;snap();return}
    raf=requestAnimationFrame(step);
  }
  raf=requestAnimationFrame(step);
}
function snap(){ // glide to the nearest whole frame
  var target=Math.round(pos);
  (function step(){
    var d=target-pos;if(Math.abs(d)<0.02){setPos(target);raf=0;return}
    setPos(pos+d*0.25);raf=requestAnimationFrame(step);
  })();
}
// desktop trackpad / wheel: horizontal scroll also spins
board.addEventListener('wheel',function(e){e.preventDefault();stopInertia();setPos(pos-(e.deltaX||e.deltaY)/PX);clearTimeout(board._w);board._w=setTimeout(snap,120)},{passive:false});
['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},{passive:false})});
document.addEventListener('touchmove',function(e){e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',function(e){e.preventDefault()});
window.__tt={get frame(){return shown},get pos(){return pos},ready:false,N:N};
})();
</script>
<script src="../menu.js"></script></body></html>
